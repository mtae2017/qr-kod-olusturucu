<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="mX0Knj2KaZBOFZZVqyVL-4lVLQ27l4CRtPeqz-NDzmI" />
    
    <!-- Primary Meta Tags -->
    <title>Ücretsiz Logolu QR Kod Oluşturucu & Wi-Fi QR Tasarlayıcı</title>
    <meta name="title" content="Ücretsiz Logolu QR Kod Oluşturucu & Wi-Fi QR Tasarlayıcı">
    <meta name="description" content="Web siteniz, Wi-Fi ağınız veya sosyal medyanız için logolu, renkli QR kodlar tasarlayın ve yüksek çözünürlükte indirin. %100 Ücretsiz ve Reklamsız!">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://qr-kod-olusturucu.vercel.app/">
    <meta property="og:title" content="Gelişmiş Logolu QR Kod Oluşturucu">
    <meta property="og:description" content="Kendi logonuzla renkli QR kodlar ve Wi-Fi bağlantı kartları oluşturun. Ücretsiz indirin!">
    <meta property="og:image" content="https://images.unsplash.com/photo-1595079676339-1534801ad6cf?auto=format&fit=crop&w=1200&q=80">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://qr-kod-olusturucu.vercel.app/">
    <meta property="twitter:title" content="Gelişmiş Logolu QR Kod Oluşturucu">
    <meta property="twitter:description" content="Kendi logonuzla renkli QR kodlar ve Wi-Fi bağlantı kartları oluşturun.">
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1595079676339-1534801ad6cf?auto=format&fit=crop&w=1200&q=80">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode Styling CDN -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-6 px-4 font-sans antialiased flex flex-col justify-between">

    <div class="max-w-4xl mx-auto w-full space-y-6">
        
        <!-- Header & Top Navigation Bar -->
        <header class="flex flex-col md:flex-row items-center justify-between gap-4 border-b border-slate-800/80 pb-4">
            <div class="text-center md:text-left space-y-1">
                <div class="inline-flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-0.5 rounded-full text-emerald-400 text-[11px] font-semibold">
                    ⚡ Ücretsiz & Sınırsız
                </div>
                <h1 class="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-cyan-400 to-blue-500">
                    Özel QR Kod Oluşturucu
                </h1>
            </div>

            <!-- Top Right Cross Links -->
            <div class="flex flex-wrap items-center justify-center gap-2">
                <a href="https://yks-tercih-robotu.vercel.app" target="_blank" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 px-3 py-2 rounded-xl text-xs font-semibold text-amber-400 transition flex items-center gap-1.5 shadow-sm">
                    🎓 Tercih Robotu
                </a>
                <a href="https://yks-net-hesaplayici.vercel.app" target="_blank" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500/50 px-3 py-2 rounded-xl text-xs font-semibold text-indigo-400 transition flex items-center gap-1.5 shadow-sm">
                    📈 Net Takip Paneli
                </a>
            </div>
        </header>

        <!-- Mode Selector Tabs -->
        <div class="flex justify-center border-b border-slate-800 pb-1 gap-2 text-xs font-bold">
            <button id="tab-url" onclick="switchTab('url')" class="px-4 py-2 rounded-xl bg-slate-900 text-emerald-400 border border-slate-800">
                🌐 URL / Metin
            </button>
            <button id="tab-wifi" onclick="switchTab('wifi')" class="px-4 py-2 rounded-xl bg-slate-950 text-slate-400 hover:text-slate-200 border border-transparent">
                📶 Wi-Fi Ağı
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Controls Form (7 Cols) -->
            <div class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                
                <!-- Input Content: URL Section -->
                <div id="section-url" class="space-y-2">
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">QR Kod İçeriği / Bağlantı</label>
                    <input type="text" id="qr-data" oninput="generateQR()" value="https://google.com" placeholder="https://site-adresiniz.com veya metin" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-100 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <!-- Input Content: Wi-Fi Section -->
                <div id="section-wifi" class="space-y-3 hidden">
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Wi-Fi Bağlantı Bilgileri</label>
                    <input type="text" id="wifi-ssid" oninput="generateQR()" placeholder="Ağ Adı (SSID) Örn: Ev_Net" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <input type="text" id="wifi-pass" oninput="generateQR()" placeholder="Wi-Fi Şifresi" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <select id="wifi-type" onchange="generateQR()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="WPA">WPA / WPA2 (Şifreli - Standart)</option>
                        <option value="WEP">WEP</option>
                        <option value="nopass">Şifresiz (Açık Ağ)</option>
                    </select>
                </div>

                <!-- Logo Selection -->
                <div class="pt-2 border-t border-slate-800/80 space-y-2">
                    <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider">Ortaya Logo Ekle</label>
                    <div class="flex flex-wrap gap-2 text-xs">
                        <button onclick="setLogo('https://cdn-icons-png.flaticon.com/512/1384/1384060.png')" class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl hover:bg-slate-800 text-rose-400 transition flex items-center gap-1">📸 YouTube</button>
                        <button onclick="setLogo('https://cdn-icons-png.flaticon.com/512/3670/3670051.png')" class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl hover:bg-slate-800 text-emerald-400 transition flex items-center gap-1">💬 WhatsApp</button>
                        <button onclick="setLogo('https://cdn-icons-png.flaticon.com/512/9322/9322127.png')" class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl hover:bg-slate-800 text-cyan-400 transition flex items-center gap-1">📶 Wi-Fi</button>
                        <button onclick="setLogo('')" class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl hover:bg-slate-800 text-slate-400 transition">Logoyu Kaldır</button>
                    </div>
                    <!-- Custom Logo Upload -->
                    <div class="mt-2">
                        <label class="block text-[10px] text-slate-400 mb-1">Kendi Logonuzu Yükleyin (İsteğe Bağlı):</label>
                        <input type="file" id="logo-file" accept="image/*" onchange="uploadCustomLogo(event)" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 cursor-pointer">
                    </div>
                </div>

                <!-- Styling Options -->
                <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-800/80">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">QR Kod Rengi</label>
                        <input type="color" id="color-dots" onchange="generateQR()" value="#10b981" class="w-full h-9 bg-slate-950 border border-slate-800 rounded-xl p-1 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Arka Plan Rengi</label>
                        <input type="color" id="color-bg" onchange="generateQR()" value="#ffffff" class="w-full h-9 bg-slate-950 border border-slate-800 rounded-xl p-1 cursor-pointer">
                    </div>
                </div>

                <!-- Dots & Corner Styles -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Nokta Tipi</label>
                        <select id="dots-type" onchange="generateQR()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="square">Kare</option>
                            <option value="dots">Yuvarlak Noktalar</option>
                            <option value="rounded">Kavisli Kareler</option>
                            <option value="classy">Klasik</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Köşe Tipi</label>
                        <select id="corners-type" onchange="generateQR()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="square">Dik Dikdörtgen</option>
                            <option value="dot">Yuvarlak</option>
                            <option value="extra-rounded">Kavisli</option>
                        </select>
                    </div>
                </div>

            </div>

            <!-- Live Preview & Download (5 Cols) -->
            <div class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col items-center justify-between space-y-4">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider self-start">Canlı Önizleme</h2>
                
                <!-- Container for QR Code -->
                <div class="bg-white p-4 rounded-2xl shadow-2xl flex items-center justify-center border border-slate-200" id="canvas-container">
                    <!-- QR Code Canvas dynamically created here -->
                </div>

                <div class="w-full space-y-2">
                    <button onclick="downloadQR('png')" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl text-xs shadow-lg transition flex items-center justify-center gap-2">
                        📥 Yüksek Kalitede İndir (PNG)
                    </button>
                    <p class="text-[10px] text-slate-500 text-center">Tüm iOS ve Android cihazlarla %100 uyumludur.</p>
                </div>
            </div>

        </div>

    </div>

    <!-- Simple Footer -->
    <footer class="mt-12 pt-4 text-center border-t border-slate-800/60">
        <p class="text-[10px] text-slate-600">© 2026 Akıllı Web Araçları. Tüm hakları saklıdır.</p>
    </footer>

    <!-- JavaScript Engine -->
    <script>
        let qrCode;
        let activeTab = 'url';
        let currentLogo = '';

        function initQR() {
            qrCode = new QRCodeStyling({
                width: 250,
                height: 250,
                type: "canvas",
                data: "https://google.com",
                image: "",
                dotsOptions: { color: "#10b981", type: "square" },
                backgroundOptions: { color: "#ffffff" },
                cornersSquareOptions: { type: "square" },
                imageOptions: { crossOrigin: "anonymous", margin: 8, imageSize: 0.25 }
            });

            const container = document.getElementById("canvas-container");
            container.innerHTML = "";
            qrCode.append(container);
        }

        function switchTab(tab) {
            activeTab = tab;
            const tabUrl = document.getElementById('tab-url');
            const tabWifi = document.getElementById('tab-wifi');
            const secUrl = document.getElementById('section-url');
            const secWifi = document.getElementById('section-wifi');

            if (tab === 'url') {
                tabUrl.className = "px-4 py-2 rounded-xl bg-slate-900 text-emerald-400 border border-slate-800";
                tabWifi.className = "px-4 py-2 rounded-xl bg-slate-950 text-slate-400 hover:text-slate-200 border border-transparent";
                secUrl.classList.remove('hidden');
                secWifi.classList.add('hidden');
            } else {
                tabWifi.className = "px-4 py-2 rounded-xl bg-slate-900 text-emerald-400 border border-slate-800";
                tabUrl.className = "px-4 py-2 rounded-xl bg-slate-950 text-slate-400 hover:text-slate-200 border border-transparent";
                secWifi.classList.remove('hidden');
                secUrl.classList.add('hidden');
            }
            generateQR();
        }

        function getQRPayload() {
            if (activeTab === 'url') {
                return document.getElementById("qr-data").value || "https://google.com";
            } else {
                const ssid = document.getElementById("wifi-ssid").value || "Wifi_Agim";
                const pass = document.getElementById("wifi-pass").value || "";
                const type = document.getElementById("wifi-type").value;
                return `WIFI:S:${ssid};T:${type};P:${pass};;`;
            }
        }

        function setLogo(url) {
            currentLogo = url;
            document.getElementById('logo-file').value = "";
            generateQR();
        }

        function uploadCustomLogo(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentLogo = e.target.result;
                    generateQR();
                };
                reader.readAsDataURL(file);
            }
        }

        function generateQR() {
            const payload = getQRPayload();
            const colorDots = document.getElementById("color-dots").value;
            const colorBg = document.getElementById("color-bg").value;
            const dotsType = document.getElementById("dots-type").value;
            const cornersType = document.getElementById("corners-type").value;

            qrCode.update({
                data: payload,
                image: currentLogo,
                dotsOptions: { color: colorDots, type: dotsType },
                backgroundOptions: { color: colorBg },
                cornersSquareOptions: { type: cornersType }
            });
        }

        function downloadQR(format) {
            qrCode.download({ name: "qr-kodum", extension: format });
        }

        window.onload = function() {
            initQR();
        };
    </script>
</body>
</html>
